[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sm-systems-hubspot-zendesk-customer-handoff"
version = "0.1.0"
description = "Approval-gated HubSpot-to-Zendesk customer onboarding handoff"
requires-python = ">=3.11"

[project.scripts]
customer-handoff = "customer_handoff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

